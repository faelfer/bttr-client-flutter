name: Flutter mobile
on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - run: ./scripts/quality.sh dependencies
      - run: ./scripts/quality.sh dart-format-check
      - run: ./scripts/quality.sh dart-lint
      - run: ./scripts/quality.sh test
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
