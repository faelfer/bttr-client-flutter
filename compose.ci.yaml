x-ci-service: &ci-service
  init: true
  working_dir: /workspace
  user: '${CI_UID:-1000}:${CI_GID:-1000}'
  environment:
    CI: 'true'
    HOME: /tmp
    PUB_CACHE: /workspace/.pub-cache
    GRADLE_USER_HOME: /workspace/.gradle-cache
    XDG_CACHE_HOME: /workspace/.cache
    CI_UID: '${CI_UID:-1000}'
    CI_GID: '${CI_GID:-1000}'
  volumes:
    - type: bind
      source: ${CI_WORKSPACE:-.}
      target: /workspace

services:
  flutter:
    <<: *ci-service
    build:
      context: .
      dockerfile: Dockerfile.flutter-ci
    image: bttr-client-flutter-ci:3.41.9
    entrypoint: [sh]

  android-e2e:
    <<: *ci-service
    build:
      context: .
      dockerfile: Dockerfile.android-e2e
    image: bttr-client-flutter-android-e2e:3.41.9-node24-api36
    # Appium, Flutter and the headless emulator share this container. Host
    # networking makes the mock published on 127.0.0.1 visible through the
    # emulator's 10.0.2.2 host alias.
    network_mode: host
    shm_size: 2gb
    devices:
      - /dev/kvm:/dev/kvm
    group_add:
      - '${KVM_GID:-0}'
    environment:
      CI: 'true'
      HOME: /tmp
      PUB_CACHE: /workspace/.pub-cache
      GRADLE_USER_HOME: /workspace/.gradle-cache
      XDG_CACHE_HOME: /workspace/.cache
      CI_UID: '${CI_UID:-1000}'
      CI_GID: '${CI_GID:-1000}'
      BTTR_MOCK_API_PORT: '${BTTR_MOCK_API_PORT:-18080}'
      BTTR_MOCK_API_MANAGED_EXTERNALLY: '1'
    entrypoint: [sh]

  swift-format:
    <<: *ci-service
    image: swift:6.3.3-bookworm
    entrypoint: [sh]

  swiftlint:
    <<: *ci-service
    image: ghcr.io/realm/swiftlint:0.65.0
    entrypoint: [sh]
